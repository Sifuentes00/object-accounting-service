
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Liquibase
spring.liquibase.enabled=false

# OAuth2 (disabled for simple context loading)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/test-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/test-realm/protocol/openid-connect/certs

# MinIO
minio.endpoint=http://localhost:9000
minio.access-key=test
minio.secret-key=test

# Logging
logging.level.org.springframework.security=DEBUG
